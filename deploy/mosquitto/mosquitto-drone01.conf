# drone-01 local broker — port 1884
listener 1884 127.0.0.1
allow_anonymous true

persistence true
persistence_location /var/lib/mosquitto/drone01/

log_dest file /var/log/mosquitto/drone01.log
log_type error warning notice information

# Bridge to cloud (1883 = SSH tunnel to EC2) — DISABLED 2026-09-11
# Tunnel has been down for days; aggressive 5-30s bridge reconnect was starving
# the single-threaded broker's message pump, causing periodic setpoint-stream
# stalls (>3s) that dropped drone-02 out of OFFBOARD.  Re-enable when the
# cloud dashboard / remote-operator plane comes back online, and consider
# managing the SSH tunnel under systemd so this bridge stays connected.
# connection cloud-bridge-drone01
# address 127.0.0.1:1883
# clientid bridge-drone01
#
# topic drone/drone-01/telemetry_enc out 1
# topic drone/drone-01/cmd_ack       out 1
# topic drone/drone-01/cmd           in  1
# topic drone/drone-02/telemetry_enc out 1
# topic drone/drone-02/cmd_ack       out 1
# topic drone/drone-02/cmd           in  1
#
# bridge_attempt_unsubscribe false
# try_private false
# cleansession true
# start_type automatic
# restart_timeout 5 30
